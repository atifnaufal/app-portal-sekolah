; Konfigurasi PHP untuk deployment Railway (Nixpacks membaca file ini di root proyek).
; Tujuan utama: menekan pemakaian memori per request, karena gejala yang muncul
; adalah dashboard blank lalu normal lagi — konsisten dengan worker PHP yang
; kena OOM-kill di container tier trial.

memory_limit = 256M

; --- OPcache: hindari kompilasi ulang PHP di setiap request ---
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.fast_shutdown = 1

; validate_timestamps=0 berarti OPcache TIDAK memeriksa perubahan file.
; Ini aman di container immutable (kode hanya berubah saat redeploy, dan
; redeploy membuat container baru sehingga cache ikut segar).
; Bila Anda pernah edit file langsung di container, jalankan ulang deploy.

; --- Upload: tugas & jawaban siswa maksimum 10MB di validator Laravel ---
upload_max_filesize = 12M
post_max_size = 14M

; --- Timeout: email ke satu kelas dikirim sinkron (tidak ada queue worker) ---
max_execution_time = 120

; --- Log: jangan biarkan error PHP membanjiri stdout ---
log_errors = On
display_errors = Off
error_log = /dev/stderr

date.timezone = Asia/Jakarta
