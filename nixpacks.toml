[variables]
NIXPACKS_PHP_VERSION = "8.3"

[phases.setup]
nixPkgs = ["php83", "php83Packages.composer", "php83Extensions.gd", "php83Extensions.pdo_mysql", "php83Extensions.zip", "php83Extensions.intl"]
cmds = [
    "bash ensure-env.sh"
]

[phases.build]
cmds = [
    # Pastikan .env & APP_KEY ada SEBELUM tool apa pun yang memanggil
    # `php artisan key:generate` (mis. Nixpacks/Composer) — mencegah error
    # "file_get_contents(/app/.env): Failed to open stream" saat deploy.
    "chmod +x ensure-env.sh && bash ensure-env.sh",
    "composer install --no-dev --optimize-autoloader",
    "npm ci",
    "npm run build"
]

# db:seed sengaja DIHAPUS dari fase deploy: dulu dijalankan tiap cold start
# sehingga data seed bisa dobel / deploy gagal. Seed cukup dijalankan manual sekali.
# storage:link diberi || true karena perintah ini exit non-zero bila symlink sudah ada.
# PENTING: ensure-env.sh WAJIB jalan SEBELUM config:cache agar .env terisi Railway vars.
[phases.deploy]
cmds = [
    "bash ensure-env.sh",
    "php artisan config:clear",
    "php artisan route:clear",
    "php artisan view:clear",
    "php artisan cache:clear",
    "php artisan migrate --force || true",
    "php artisan storage:link || true",
    "php artisan config:cache",
    "php artisan route:cache",
    "php artisan view:cache"
]

# Start command disamakan dengan Procfile (web: bash start-web.sh).
# php-fpm + nginx SENGAJA tidak dipakai: riwayat deploy menunjukkan binary
# php-fpm/nginx tidak terpasang andal di image Railway ("php-fpm: command not
# found"), yang membuat server gagal start -> 500 semua halaman.
# start-web.sh menjalankan ensure-env.sh (samakan .env + APP_KEY + DATABASE_URL)
# lalu `php artisan serve` di $PORT dinamis Railway.
[start]
cmd = "bash start-web.sh"
