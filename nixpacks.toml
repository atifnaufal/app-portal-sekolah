[phases.build]
cmds = ["composer install --no-dev --optimize-autoloader", "npm install", "npm run build"]

[phases.deploy]
cmds = ["php artisan migrate --force", "php artisan db:seed --force", "php artisan config:cache", "php artisan route:cache", "php artisan view:cache"]

# Biarkan Railway/Nixpacks menggunakan settingan default PHP (Nginx) yang lebih stabil daripada artisan serve
