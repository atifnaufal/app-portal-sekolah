<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><title>Offline — Portal Sekolah</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,system-ui,sans-serif;background:#f6f7fb;color:#0f172a;min-height:100vh;display:flex;flex-direction:column}.wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:16px}.card{width:100%;max-width:520px;background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 20px 60px rgba(15,23,42,.08);border:1px solid rgba(15,23,42,.07)}.hero{padding:32px 24px;text-align:center;background:linear-gradient(135deg,#0f172a,#1e1b4b);color:#fff}.ico{width:84px;height:84px;border-radius:22px;background:rgba(255,255,255,.08);display:grid;place-items:center;margin:0 auto 16px}.ico i{font-size:38px;color:#f87171}h1{font-size:22px;font-weight:900}.sub{font-size:11px;letter-spacing:.12em;opacity:.6;margin-top:6px;font-weight:700;text-transform:uppercase}.body{padding:20px}.btn{display:inline-flex;gap:8px;align-items:center;padding:12px 18px;border-radius:14px;font-weight:800;text-decoration:none;border:0;cursor:pointer}.btn-primary{color:#fff;background:linear-gradient(135deg,#4f46e5,#2563eb)}.btn-ghost{background:#fff;border:1px solid #e2e8f0;color:#0f172a}</style></head><body><div class="wrap"><div class="card"><div class="hero"><div class="ico"><i class="bi bi-wifi-off"></i></div><h1>Tidak Ada Koneksi</h1><div class="sub">Offline — net::ERR_FAILED</div></div><div class="body"><p style="font-size:13px;color:#64748b;line-height:1.6">Halaman tidak dapat dimuat karena offline. Periksa Wi-Fi/Data lalu coba lagi.</p><div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap"><button class="btn btn-primary" onclick="location.reload()"><i class="bi bi-arrow-clockwise"></i> Coba Lagi</button><button class="btn btn-ghost" onclick="history.back()"><i class="bi bi-arrow-left"></i> Kembali</button></div><p style="font-size:11px;color:#94a3b8;margin-top:14px" id="u"></p></div></div></div><script>document.getElementById('u').textContent=location.href;window.addEventListener('online',()=>location.reload());</script></body></html>
